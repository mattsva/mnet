name: make test

on:
  push:
  pull_request:

jobs:
  test-make:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests with Make
        run: make test

  test-cmake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake ..
          make

      - name: Run tests with CTest
        run: cd build && ctest --output-on-failure

  test-meson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Meson
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Build with Meson
        run: |
          meson setup build
          meson compile -C build

      - name: Run tests with Meson
        run: meson test -C build --print-errorlogs

  # Catch platform-specific breakage (missing headers, POSIX-only APIs,
  # non-portable socket/file code) before it reaches a release tag.
  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test with CMake
        shell: bash
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build . --config Release
          ctest --output-on-failure -C Release

  # Memory-safety and undefined-behaviour checks. The HTTP integration tests
  # drive a real server, which is where the parser bugs showed up.
  test-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: |
          CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -g \
                  -fsanitize=address,undefined -fno-omit-frame-pointer \
                  -D_POSIX_C_SOURCE=200112L -Iinclude -Isrc -pthread"
          gcc $CFLAGS src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_mnet.c -o test_mnet_asan
          gcc $CFLAGS src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_http.c -o test_http_asan
          gcc $CFLAGS src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_mnet_parser.c -o test_parser_asan
          gcc $CFLAGS src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_stress.c -o test_stress_asan
          gcc $CFLAGS src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_features.c -o test_features_asan

      - name: Run unit tests under ASan/UBSan
        run: ASAN_OPTIONS=detect_leaks=1 ./test_mnet_asan

      - name: Run HTTP tests under ASan/UBSan
        run: ASAN_OPTIONS=detect_leaks=0 ./test_http_asan

      - name: Run parser and concurrency tests under ASan/UBSan
        run: ASAN_OPTIONS=detect_leaks=0 ./test_parser_asan

      - name: Run stress tests under ASan/UBSan
        run: ASAN_OPTIONS=detect_leaks=0 ./test_stress_asan

      - name: Run feature tests under ASan/UBSan
        run: ASAN_OPTIONS=detect_leaks=0 ./test_features_asan

  test-valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build tests
        run: make test_mnet test_http test_parser test_stress test_features

      - name: Valgrind unit tests
        run: valgrind --leak-check=full --error-exitcode=1 ./test_mnet

      - name: Valgrind HTTP tests
        run: valgrind --leak-check=full --error-exitcode=1 --trace-children=yes ./test_http

      - name: Valgrind parser and concurrency tests
        run: valgrind --leak-check=full --error-exitcode=1 --trace-children=yes ./test_parser

      - name: Valgrind stress tests
        run: valgrind --leak-check=full --error-exitcode=1 --trace-children=yes ./test_stress

      - name: Valgrind feature tests
        run: valgrind --leak-check=full --error-exitcode=1 --trace-children=yes ./test_features

  # The worker pool is the one part of the library that is only exercised with
  # threads, so run the concurrency tests under ThreadSanitizer too.
  test-tsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ThreadSanitizer
        run: |
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g \
              -fsanitize=thread -D_POSIX_C_SOURCE=200112L \
              -Iinclude -Isrc -pthread \
              src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_mnet_parser.c \
              -o test_parser_tsan
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -g \
              -fsanitize=thread -D_POSIX_C_SOURCE=200112L \
              -Iinclude -Isrc -pthread \
              src/mnet.c src/mnet_app.c src/mnet_response.c \
              src/mnet_request.c src/mnet_router.c test/test_stress.c \
              -o test_stress_tsan

      - name: Run parser and concurrency tests under TSan
        run: ./test_parser_tsan

      - name: Run stress tests under TSan
        run: ./test_stress_tsan
